# 공개 서버 배포용 오버라이드.
#
#   docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d --build
#
# 기본 compose와의 차이:
#   - PostgreSQL / Redis 포트를 외부에 열지 않는다 (컨테이너 네트워크로만 통신)
#   - API도 루프백에만 바인딩한다. 외부 노출은 Nginx가 담당한다
#   - Redis에 requirepass를 건다
#   - DB_SYNCHRONIZE를 끈다 (엔티티 변경이 운영 스키마를 건드리지 못하도록)
#   - 비밀번호에 기본값을 두지 않는다. 없으면 뜨지 않는 편이 안전하다
#
# .env.prod 를 먼저 만들고 --env-file 로 넘기거나 .env 로 복사할 것.

services:
  postgres:
    environment:
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD를 설정하세요}
    # 기본 compose의 포트 매핑을 지운다. 밖에서 접근할 이유가 없다.
    ports: !reset []
    restart: always

  redis:
    command:
      - redis-server
      - --appendonly
      - "yes"
      - --requirepass
      - ${REDIS_PASSWORD:?REDIS_PASSWORD를 설정하세요}
    # redis-cli도 인증이 필요하므로 헬스체크에 비밀번호를 넘긴다
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    ports: !reset []
    restart: always

  api:
    environment:
      DB_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD를 설정하세요}
      REDIS_PASSWORD: ${REDIS_PASSWORD:?REDIS_PASSWORD를 설정하세요}
      # 최초 1회만 true로 띄워 스키마를 만든 뒤 false로 되돌린다.
      DB_SYNCHRONIZE: ${DB_SYNCHRONIZE:-false}
      DB_LOGGING: "false"
      CORS_ORIGIN: ${CORS_ORIGIN:?허용할 도메인을 설정하세요 (쉼표 구분)}
      NODE_ENV: production
    # 루프백에만 바인딩한다. TLS 종료와 외부 노출은 Nginx가 맡는다.
    # !override 를 써야 기본 compose의 매핑이 병합되지 않고 교체된다.
    # (!reset 은 값을 비우므로 호스트에서 접근할 수 없게 된다)
    ports: !override
      - "127.0.0.1:${PORT:-3000}:3000"
    restart: always
